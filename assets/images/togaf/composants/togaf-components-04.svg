<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1040" role="img" aria-labelledby="title desc">
  <title id="title">TOGAF Architecture Content Framework</title>
  <desc id="desc">Vue des catalogues, matrices, diagrammes centraux et extensions pour les architectures métier, data, applicative et technologique, ainsi que la vision, les exigences et les solutions.</desc>
  <defs>
