---
layout: default
---
<article class="article">
  <p class="eyebrow">{{ page.date | date: "%d %B %Y" }}{% if page.categories.size > 0 %} · {{ page.categories | join: ", " }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="article-lead">{{ page.description }}</p>{% endif %}
  <div class="article-content">{{ content }}</div>
  <div class="article-end"><a href="{{ '/archives/' | relative_url }}">← Tous les articles</a></div>
</article>
