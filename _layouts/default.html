<!doctype html>
<html lang="{{ site.lang | default: 'fr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">riahi<span>.tech</span></a>
      <nav>
        <a href="{{ '/' | relative_url }}">Accueil</a>
        <a href="{{ '/archives/' | relative_url }}">Articles</a>
        <a href="{{ '/about/' | relative_url }}">À propos</a>
      </nav>
    </div>
  </header>
  <main class="container">{{ content }}</main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© {{ 'now' | date: "%Y" }} {{ site.author.name }} · riahi.tech</span>
      <span>Architecture · Data · AI</span>
    </div>
  </footer>
</body>
</html>
